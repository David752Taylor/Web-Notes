<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    let second = +prompt('请输入秒数：')

    function getTime(t) {
      let d = parseInt(t / 60 / 60 / 24)
      let h = parseInt(t / 60 / 60 % 24)
      let m = parseInt(t / 60 % 60)
      let s = parseInt(t % 60)
      d = d < 10 ? '0' + d : d
      h = h < 10 ? '0' + h : h
      m = m < 10 ? '0' + m : m
      s = s < 10 ? '0' + s : s
      return `倒计时：${d}天${h}时${m}分${s}秒`
    }

    let str = getTime(second)

    document.write(str)

  </script>
</body>

</html>
