    const box = document.querySelector('div')
    let i = 0
    function mouseMove() {
      box.innerHTML = i++
    }
    function throttle(fn, t) {
      let timer = null
      return function () {
        if (!timer) {
          timer = setTimeout(function () {
            fn()
            timer = null  //不能直接清除定时器
          }, t)
        }
      }
    }
    box.addEventListener('mousemove', throttle(mouseMove, 500))
