<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap 弹框</title>
  <link rel="stylesheet" href="../Download/bootstrap/css/bootstrap.min.css">

</head>

<body>
  <button type="button" class="btn btn-primary edit-btn" data-bs-toggle="modal" data-bs-target=".name-box">
    编辑姓名
  </button>
  <div class="modal name-box" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">请输入姓名</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form action="">
            <span>姓名</span>
            <input type="text" class="username">
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary save-btn">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../Download/bootstrap/js/bootstrap.min.js"></script>
  <script>

    const modal = new bootstrap.Modal('.name-box')

    document.querySelector('.edit-btn').addEventListener('click', () => {
      document.querySelector('.username').value = '默认姓名'
      modal.show()
    })

    document.querySelector('.save-btn').addEventListener('click', () => {
      const username = document.querySelector('.username').value
      console.log(username);

      modal.hide()
    })

    // const myModal = new bootstrap.Modal('#myModal', {
    //   keyboard: false
    // })
  </script>
</body>

</html>
