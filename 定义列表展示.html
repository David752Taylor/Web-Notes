<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定义列表示例</title>
    <style>
        dl {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        dt {
            font-weight: bold;
            color: #2c3e50;
        }

        dd {
            margin: 5px 0 15px 20px;
            color: #34495e;
        }
    </style>
</head>

<body>

    <h1>常见网页技术定义</h1>

    <dl>
        <dt>HTML</dt>
        <dd>超文本标记语言，用于创建网页和网页应用的结构。</dd>

        <dt>CSS</dt>
        <dd>层叠样式表，用于描述网页的外观和布局。</dd>

        <dt>JavaScript</dt>
        <dd>一种编程语言，主要用于网页交互和动态效果。</dd>
    </dl>

</body>

</html>
