<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>省农村水工程管理系统</title>
    <!-- <link rel="stylesheet" href="./CSS/login.css"> -->
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            height: 100%;
            /* background-image: linear-gradient(to right, #fbc2eb, #a6c1ee); */
            background-image: url(../image/ncwu1.jpg);
            background-size: contain;
            background-attachment: fixed;
        }

        .login-wrapper {
            background-color: rgba(255, 255, 255, 0.4);
            width: 358px;
            height: 588px;
            border-radius: 15px;
            padding: 0 50px;
            position: relative;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .header {
            font-size: 38px;
            font-weight: bold;
            text-align: center;
            line-height: 200px;
            color: rgba(0, 0, 0, 0.8);
        }

        .input-item {
            display: block;
            width: 100%;
            margin-bottom: 20px;
            border: 0;
            padding: 10px;
            border-bottom: 1px solid rgba(128, 125, 125, 0.5);
            font-size: 15px;
            outline: none;
            background-color: rgba(255, 255, 255, 0.7);
        }

        .input-item:placeholder {
            text-transform: uppercase;
        }

        .btn {
            text-align: center;
            padding: 10px;
            width: 100%;
            margin-top: 40px;
            background-image: linear-gradient(to right, rgb(166, 193, 238, 0.8), rgb(251, 194, 235, 0.8));
            color: rgba(255, 255, 255, 0.8);
        }

        .msg {
            text-align: center;
            line-height: 88px;
        }

        html {
            height: 100%;
        }

        body {
            height: 100%;
        }

        a {
            text-decoration-line: none;
            color: rgb(171, 193, 238, 0.3);
        }
    </style>
    <link rel="stylesheet" href="./CSS/login.css">
</head>

<body>
    <a href="#"><img src="" alt=""></a>
    <div class="container">
        <div class="login-wrapper">
            <div class="header">用户登录</div>
            <div class="form-wrapper">
                <input type="text" name="username" placeholder="请输入用户名" class="input-item">
                <input type="password" name="password" placeholder="请输入密码" class="input-item">
                <div class="btn">登录</div>
            </div>
            <div class="msg">
                <a href="#">忘记密码</a>
                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <a href="#">注册新用户</a>
            </div>
        </div>
    </div>
</body>

</html>
