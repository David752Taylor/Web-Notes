  <!-- 填写标签 -->
  <div id="jsCountdown">
    <span>01天</span>
    <span>02:</span>
    <span>03:</span>
    <span>04</span>
  </div>
  <script type="text/javascript">
    // 填写JavaScript
    function second(second) {
      const day = parseInt(second / 60 / 60 / 24)
      const hour = parseInt(second / 60 / 60 % 24)
      const min = parseInt(second / 60 % 60)
      const sec = parseInt(second % 60)
      return { day, hour, min, 'second': sec }
    }

    function render(data) {
      for (let i in data) {
        data[i] = data[i] > 9 ? data[i] : '0' + data[i]
      }
      const div = document.getElementById('jsCountdown')
      if (data.day === '00') {
        div.children[0].classList.add('hide')
      } else {
        div.children[0].innerHTML = data.day + '天'
      }
      div.children[1].innerHTML = data.hour + ':'
      div.children[1].innerHTML = data.min + ':'
      div.children[1].innerHTML = data.second + ':'
    }
  </script>
