<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表格示例</title>
  <style>
    table {
      width: 80%;
      margin: 20px auto;
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #f2f2f2;
    }

    caption {
      font-size: 1.5em;
      margin: 10px;
      font-weight: bold;
    }

    tfoot {
      font-weight: bold;
      background-color: #f9f9f9;
    }

    thead {
      background-color: #f2f2f2;
    }
  </style>
</head>

<body>

  <h1>学生成绩表</h1>

  <table>
    <caption>2025年第一学期成绩</caption>
    <thead>
      <tr>
        <th>学号</th>
        <th>姓名</th>
        <th>语文</th>
        <th>数学</th>
        <th>英语</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1001</td>
        <td>张三</td>
        <td>88</td>
        <td>92</td>
        <td>85</td>
      </tr>
      <tr>
        <td>1002</td>
        <td>李四</td>
        <td>79</td>
        <td>84</td>
        <td>90</td>
      </tr>
      <tr>
        <td>1003</td>
        <td>王五</td>
        <td>85</td>
        <td>88</td>
        <td>87</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="5">总分：每个学生的各科成绩总和</td>
      </tr>
    </tfoot>
  </table>

</body>

</html>
